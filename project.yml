name: HomeRoll
options:
  bundleIdPrefix: org.homeroll
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  HomeRoll:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: FotosShare
      - target: FotosWidget
    entitlements:
      path: App/HomeRoll.entitlements
      properties:
        com.apple.security.application-groups: [group.org.homeroll.app]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: HomeRoll
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [org.homeroll.app.backup]
        NSPhotoLibraryUsageDescription: "Damit deine Fotos auf deinem eigenen Server gesichert werden."
        NSPhotoLibraryAddUsageDescription: "Damit Fotos vom Server auf dem iPhone gespeichert werden können."
        NSFaceIDUsageDescription: "Damit „Ausgeblendet“ und „Zuletzt gelöscht“ nur du öffnen kannst."
        NSLocalNetworkUsageDescription: "Verbindung zu deinem Fotoserver im Heimnetz."
        CFBundleURLTypes:
          - CFBundleURLName: org.homeroll.app
            CFBundleURLSchemes: [homeroll]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.homeroll.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FotosShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: Shared
    entitlements:
      path: Share/FotosShare.entitlements
      properties:
        com.apple.security.application-groups: [group.org.homeroll.app]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: HomeRoll
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 50
              NSExtensionActivationSupportsMovieWithMaxCount: 20
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.homeroll.app.share
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  FotosWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    entitlements:
      path: Widget/FotosWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.org.homeroll.app]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: HomeRoll
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.homeroll.app.widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO


  HomeRollRuntimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RuntimeTests
    dependencies:
      - target: HomeRoll
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  HomeRollUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: HomeRoll
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HomeRoll:
    build:
      targets:
        HomeRoll: all
    test:
      targets:
        - HomeRollRuntimeTests
        - HomeRollUITests
